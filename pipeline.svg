<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline CI đã sửa</title>
  <desc id="desc">Checkout, cấp quyền Gradle, test và tạo JAR, đăng nhập GHCR, build và push Docker image.</desc>
  <rect width="960" height="260" fill="#ffffff"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#17202a">
    <text x="480" y="38" font-size="22">SS12 EX05: Pipeline CI đã sửa</text>
    <g fill="#f0fdf4" stroke="#15803d"><rect x="20" y="80" width="145" height="80" rx="6"/><rect x="205" y="80" width="155" height="80" rx="6"/><rect x="400" y="80" width="160" height="80" rx="6"/></g>
    <g fill="#eff6ff" stroke="#2563eb"><rect x="600" y="80" width="145" height="80" rx="6"/><rect x="785" y="80" width="155" height="80" rx="6"/></g>
    <g font-size="16"><text x="92" y="124">Checkout</text><text x="282" y="116">chmod +x</text><text x="282" y="140">gradlew</text><text x="480" y="116">Gradle test</text><text x="480" y="140">+ bootJar</text><text x="672" y="116">Login GHCR</text><text x="672" y="140">REGISTRY_TOKEN</text><text x="862" y="116">Docker build</text><text x="862" y="140">+ push</text></g>
    <text x="480" y="216" font-size="16">Build context: .  |  Dockerfile: ./Dockerfile  |  JAR: build/libs/app.jar</text>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><path d="M165 120 H195"/><path d="M360 120 H390"/><path d="M560 120 H590"/><path d="M745 120 H775"/></g>
</svg>
